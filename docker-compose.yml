services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      STORY42_DB_PATH: /data/story42.sqlite3
    volumes:
      - story42_data:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  story42_data:
